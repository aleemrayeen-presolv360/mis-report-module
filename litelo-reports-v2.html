<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Litelo · Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1e2a44; --navy-2:#2b3a58;
  --indigo:#4f46e5; --indigo-bg:#eef0fd;
  --blue:#2563eb;
  --teal:#0f9b84; --teal-bg:#e6f7f4;
  --amber:#b45309; --amber-bg:#fdf6e7;
  --red:#b91c1c; --red-bg:#fdeeee;
  --purple:#7c5cd6; --purple-bg:#f5eefb;
  --page:#f5f6f8; --card:#fff; --sunk:#fafafc;
  --t1:#16203a; --t2:#6b7280; --t3:#9aa1ae;
  --bd:#e8eaee; --bd2:#d8dce4;
  --c1:#4f46e5; --c2:#0f9b84; --c3:#d99323; --c4:#c2559e; --c5:#3b82f6; --c6:#7c5cd6;
  --r:9px; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0e1117; --card:#161a22; --sunk:#12161d; --navy:#0b0e14; --navy-2:#1a2130;
  --t1:#e8ecf4; --t2:#98a3b6; --t3:#6b7686; --bd:#252b36; --bd2:#333b49;
  --indigo:#a5b4fc; --indigo-bg:#1e1b4b; --blue:#7fb0f5;
  --teal:#4ecfb4; --teal-bg:#0d2b26; --amber:#e3a857; --amber-bg:#2b2113; --red:#f08a8a; --red-bg:#2c1516;
  --c1:#a5b4fc; --c2:#4ecfb4; --c3:#e3a857; --c4:#f07ab0; --c5:#7fb0f5; --c6:#b79cf5; color-scheme:dark;}}
:root[data-theme="dark"]{
  --page:#0e1117; --card:#161a22; --sunk:#12161d; --navy:#0b0e14; --navy-2:#1a2130;
  --t1:#e8ecf4; --t2:#98a3b6; --t3:#6b7686; --bd:#252b36; --bd2:#333b49;
  --indigo:#a5b4fc; --indigo-bg:#1e1b4b; --blue:#7fb0f5;
  --teal:#4ecfb4; --teal-bg:#0d2b26; --amber:#e3a857; --amber-bg:#2b2113; --red:#f08a8a; --red-bg:#2c1516;
  --c1:#a5b4fc; --c2:#4ecfb4; --c3:#e3a857; --c4:#f07ab0; --c5:#7fb0f5; --c6:#b79cf5; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--t1);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:4px}
h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em}
h3{margin:0;font-size:14px;font-weight:500}
p{margin:0}
.mut{color:var(--t2)} .sm{font-size:12.5px} .xs{font-size:11.5px;color:var(--t3)}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{width:240px;flex:0 0 240px;background:var(--card);border-right:1px solid var(--bd);padding:16px 14px;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 26px;font-weight:600;font-size:20px;letter-spacing:-.02em;color:var(--t1)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#4b5563;font-size:14.5px;width:100%;text-align:left}
:root[data-theme="dark"] .nav{color:var(--t2)}
.nav:hover{background:var(--sunk);color:var(--t1)}
.nav[aria-current="page"]{background:var(--indigo-bg);color:var(--indigo);font-weight:500}
.nav svg{flex:none}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:30}
.ti{padding:0 24px;display:flex;align-items:center;justify-content:flex-end;gap:14px;min-height:60px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
:root[data-theme="dark"] .av{background:var(--indigo);color:#0e1117}
.who{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--bd)}
.who p{font-size:13.5px;font-weight:500;line-height:1.3}
.who small{color:var(--t3);font-size:11.5px}
.content{padding:0 24px 80px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--bd);margin:0 -24px 20px;padding:0 24px;background:var(--card)}
.tabs button{padding:15px 0 13px;border-bottom:2px solid transparent;color:var(--t2);font-size:14px}
.tabs button[aria-current="page"]{color:var(--indigo);font-weight:500;border-bottom-color:var(--indigo)}
.tabs button:hover{color:var(--t1)}
.rolesw{display:flex;border:1px solid var(--bd);border-radius:20px;padding:2px;gap:2px}
.rolesw button{padding:5px 13px;border-radius:20px;font-size:12px;color:var(--t2)}
.rolesw button[aria-pressed="true"]{background:var(--indigo-bg);color:var(--indigo);font-weight:500}
.iconbtn{width:32px;height:32px;border:1px solid var(--bd);border-radius:var(--r);display:grid;place-items:center;color:var(--t2)}
.iconbtn:hover{background:var(--sunk)}
main{padding-top:22px}
@media (max-width:880px){.rail{display:none}.content{padding:0 16px 70px}.tabs{margin:0 -16px 18px;padding:0 16px}}

/* filter bar */
.fbar{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:6px}
.fg > span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--bd);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:6px;font-size:13px;color:var(--t2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--t1);font-weight:500;box-shadow:0 0 0 1px var(--bd2)}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{border:1px solid var(--bd2);background:var(--card);border-radius:var(--r);padding:8px 11px;min-height:37px;width:100%}
textarea{min-height:62px;resize:vertical;line-height:1.5}
select{cursor:pointer}
.fg select{min-width:190px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--card);font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--indigo);color:#0e1117;border-color:var(--indigo)}
.btn.primary:hover{opacity:.92}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.gh{border-color:transparent;background:none}
.btn.gh:hover{background:var(--sunk)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.dngr{color:var(--red)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{opacity:.9}
.ib{width:28px;height:28px;border:1px solid var(--bd);border-radius:6px;display:inline-grid;place-items:center;color:var(--t2);background:var(--card)}
.ib:hover:not(:disabled){color:var(--t1);border-color:var(--bd2)}
.ib:disabled{opacity:.3;cursor:default}

/* head */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph p{margin-top:4px;max-width:72ch}

/* panels */
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.pad{padding:18px}
.sec{padding:20px 22px;border-top:1px solid var(--bd)}
.sec:first-child{border-top:0}
.sh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step{flex:none;width:23px;height:23px;border-radius:50%;background:var(--indigo-bg);color:var(--indigo);font-weight:600;font-size:11.5px;display:grid;place-items:center;margin-top:1px}
.fld{display:block;margin-bottom:14px}
.fld > span{display:block;font-size:12px;font-weight:500;margin-bottom:5px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1 1 210px}
.hint{font-size:11.5px;color:var(--t3);margin-top:5px}

/* table */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--bd);background:var(--sunk);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--bd);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tr.tot td{font-weight:500;background:var(--sunk)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:500;border:1px solid;white-space:nowrap}
.p-a{color:var(--teal);border-color:var(--teal);background:var(--teal-bg)}
.p-d{color:var(--amber);border-color:var(--amber);background:var(--amber-bg)}
.p-n{color:var(--t2);border-color:var(--bd2);background:var(--sunk);font-weight:400}
.p-i{color:var(--indigo);border-color:var(--indigo);background:var(--indigo-bg)}
.empty{padding:50px 20px;text-align:center}
.empty p{margin:7px auto 16px;max-width:44ch;color:var(--t2);font-size:13px}

/* builder */
.bl{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px;align-items:start}
@media (max-width:1140px){.bl{grid-template-columns:1fr}}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1140px){.side{position:static}}

/* column picker */
.pick{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.pick{grid-template-columns:1fr}}
.pane{border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.pane-h{padding:9px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sunk)}
.pane-h strong{font-size:12.5px;font-weight:500}
.pane-tools{padding:9px 12px;border-bottom:1px solid var(--bd);display:flex;gap:8px}
.pane-tools input{min-height:33px;padding:6px 10px;font-size:13px}
.pane-tools select{min-height:33px;padding:6px 8px;font-size:12.5px;width:auto;max-width:150px}
.pane-b{max-height:430px;overflow:auto}
.pane-b table th{position:sticky;top:0;z-index:1;font-size:10.5px}
.pane-b td{padding:7px 12px;font-size:12.5px}
.pane-b tr{cursor:pointer}
.pane-b tr:hover td{background:var(--sunk)}
.cb{width:15px;height:15px;accent-color:var(--indigo);cursor:pointer}
.tg{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;background:var(--sunk);border:1px solid var(--bd);color:var(--t3)}
.tg.calc{background:var(--teal-bg);border-color:transparent;color:var(--teal)}
.selrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--bd)}
.selrow:last-child{border-bottom:0}
.selrow .ix{color:var(--t3);font-size:11.5px;text-align:right}
.selrow input[type=text]{min-height:30px;padding:4px 8px;font-size:12.5px}
.selrow .src{font-size:11px;color:var(--t3);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.selrow .src select{width:auto;min-height:24px;padding:1px 5px;font-size:11px}
.selrow .acts{display:flex;gap:3px}

/* filters */
.frow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr) minmax(0,1fr) 28px;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:660px){.frow{grid-template-columns:1fr 1fr}.frow .ib{justify-self:end}}
.frow select,.frow input{min-height:34px;padding:6px 9px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--indigo-bg);color:var(--indigo);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500}

/* summary blocks */
.srow{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.1fr) minmax(0,1.1fr) 28px;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:660px){.srow{grid-template-columns:1fr 1fr}.srow .ib{justify-self:end}}
.srow select{min-height:34px;padding:6px 9px;font-size:13px}
.kpis{display:flex;gap:7px;flex-wrap:wrap}
.kpi{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd2);border-radius:20px;padding:5px 12px;font-size:12.5px}
.kpi input{accent-color:var(--indigo)}
.kpi:has(input:checked){border-color:var(--indigo);background:var(--indigo-bg);color:var(--indigo)}

/* sentence */
.sent{font-size:14.5px;line-height:1.7}
.v{background:var(--indigo-bg);color:var(--indigo);padding:1px 7px;border-radius:5px;font-weight:500;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.v.miss{background:var(--red-bg);color:var(--red)}
.errs{background:var(--red-bg);color:var(--red);border-radius:var(--r);padding:11px 13px;font-size:12.5px}
.errs ul{margin:4px 0 0;padding-left:17px}
.pv table{font-size:12px}
.pv th,.pv td{padding:6px 10px;white-space:nowrap}
.pv .tw{border-radius:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* charts */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.cbox{border:1px solid var(--bd);border-radius:10px;padding:12px}
.cbox h4{margin:0 0 9px;font-size:12px;font-weight:500;color:var(--t2)}
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:13px}
.kcard{background:var(--sunk);border-radius:var(--r);padding:11px 13px}
.kcard .kl{font-size:11px;color:var(--t3)}
.kcard .kv{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.lg{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--t2)}
.sw{width:9px;height:9px;border-radius:2px;flex:none}

/* run */
.run{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.run{grid-template-columns:1fr}}
.ropt{display:block;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ropt:has(input:checked){border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo);background:var(--indigo-bg)}
.ropt input{position:absolute;opacity:0;pointer-events:none}
.ropt strong{display:block;font-weight:500;font-size:13.5px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.presets button{border:1px solid var(--bd2);border-radius:20px;padding:4px 11px;font-size:12.5px;background:var(--card)}
.presets button[aria-pressed="true"]{background:var(--indigo-bg);border-color:var(--indigo);color:var(--indigo);font-weight:500}
.rh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:13px}
.shtabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--bd);border-radius:9px;padding:3px;margin-bottom:14px;width:fit-content}
.shtabs button{padding:6px 14px;border-radius:6px;font-size:12.5px;color:var(--t2)}
.shtabs button[aria-pressed="true"]{background:var(--card);color:var(--t1);font-weight:500;box-shadow:0 0 0 1px var(--bd2)}

.note{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r);font-size:12.5px;border:1px solid var(--bd);background:var(--sunk);color:var(--t2);margin-bottom:14px}
.note b{font-weight:500;color:var(--t1)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(22,32,58,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:70}
.ov.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:460px;padding:22px;max-height:88vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal .macts{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}
.emchips{border:1px solid var(--bd2);border-radius:var(--r);padding:7px;min-height:42px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card)}
.emchips input{border:0;outline:0;flex:1;min-width:130px;min-height:26px;padding:2px 4px;background:none}
.emchip{display:inline-flex;align-items:center;gap:6px;background:var(--indigo-bg);color:var(--indigo);border-radius:20px;padding:3px 7px 3px 11px;font-size:12.5px;font-weight:500}
.emchip button{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;color:var(--indigo)}
.emchip button:hover{background:var(--card)}
.sched{display:flex;align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap;background:var(--indigo-bg);border:1px solid var(--indigo);border-radius:var(--r);padding:10px 13px;font-size:12.5px;color:var(--indigo);margin-bottom:13px}
.sched b{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:11px 17px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:90vw;font-size:13px}
:root[data-theme="dark"] .toast{background:var(--indigo);color:#0e1117}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="shell">
<aside class="rail">
  <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 15.5 11 3h5.5L8.5 15.5H3Z" fill="#c9a227"/><path d="M8 21 16 8.5h5.5L13.5 21H8Z" fill="currentColor"/></svg>Litelo</div>
  <button class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
  <button class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M5 7h14M5 7 2 14h6L5 7Zm14 0-3 7h6l-3-7Z"/></svg>Cheque Bounce</button>
  <button class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M4 10v8M9 10v8M15 10v8M20 10v8M12 3 3 8h18l-9-5Z"/></svg>EFT Dishonour</button>
  <button class="nav"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 9-5 5m-3-8 6 6M4 20h9M8.5 3.5l6 6M17 12l4 4-2 2-4-4"/></svg>Case Tracker</button>
  <button class="nav" aria-current="page"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h9l5 5v13H5V3Zm9 0v5h5M9 13h6M9 17h6"/></svg>Report</button>
</aside>
<div class="col">

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

 for(const k in g)h+=`<optgroup label="${esc(k)}">`+g[k].map(f=>`<option value="${f.k}"${f.k===sel?' selected':''}>${esc(f.l)}${f.m?' (repeats)':''}</option>`).join('')+'</optgroup>';
 return h}

 court:['JMFC Court, Pune','Metropolitan Magistrate, Mumbai','Saket District Court','CMM Court, Chennai','ACJM Court, Jaipur'],
 drt:['DRT Mumbai I','DRT Pune','DRT Delhi II'],act:['Notice dispatched','Complaint drafted','Hearing attended','Summons follow-up','Valuation ordered','Settlement call'],
 rem:['Borrower requested time','Address changed','Partial payment promised','Follow up with advocate'],
 sub:['Notice generation','Notice sent','Notice served','Summons issued','Evidence filed','Arguments']};
function one(w,f,r,rg){const k=f.k;
 if(f.t==='date'){const e=rg?rg[1].getTime():Date.now();const s=rg?rg[0].getTime():e-400*864e5;return fmtD(new Date(s+r()*Math.max(e-s,864e5)))}
 if(f.t==='bool')return r()<.3?'Yes':'No';
 if(f.t==='enum')return pick(r,f.o);
 if(f.t==='amount'){const big=w==='sarf'&&!['emi_amount','court_fee','notice_cost','advocate_fee','total_cost','emd_amount'].includes(k);
  const sml=['court_fee','notice_cost','advocate_fee','total_cost','bounce_charges'].includes(k);
  return inr(Math.round((sml?300+r()*25000:big?8e5+r()*12e6:8000+r()*45e4)/100)*100)}
 if(f.t==='number'){if(k==='dpd')return String(30+Math.floor(r()*400));
  if(k.startsWith('d_')||k==='case_age'||k==='days_in_stage')return String(3+Math.floor(r()*140));
  if(k==='area_sqft')return String(450+Math.floor(r()*2600));return String(1+Math.floor(r()*8))}
 const n=Math.floor(r()*9e5)+1e5;
 if(k==='case_id')return({s138:'S138',s25:'S25',sarf:'SRF'})[w]+'-26-'+String(n).slice(0,5);
 if(k==='batch_id')return'BATCH-'+(1000+Math.floor(r()*60));
 if(k==='lan')return'LAN'+n+String(Math.floor(r()*90)+10);
 if(['borrower_name','co_borrower','borrower_father','auth_rep'].includes(k))return pick(r,P.names);
 if(k==='borrower_mobile'||k==='borrower_whatsapp')return'98'+n+String(Math.floor(r()*90)+10);
 if(k==='borrower_email')return pick(r,P.names).split(' ')[0].toLowerCase()+n%999+'@mail.com';
 if(['advocate','auth_officer'].includes(k))return pick(r,P.adv);
 if(k==='law_firm')return pick(r,P.firm);
 if(k.includes('bank'))return pick(r,P.bank);
 if(k.includes('city')||k==='branch'||k.includes('branch')||k==='jurisdiction')return pick(r,P.city);
 if(k==='court_name')return pick(r,P.court);
 if(k==='drt_name')return pick(r,P.drt);
 if(k==='last_action'||k==='next_action')return pick(r,P.act);
 if(k==='remarks')return pick(r,P.rem);
 if(k.includes('sub_stage'))return pick(r,P.sub);
 if(k==='pincode')return String(4e5+Math.floor(r()*99999));
 if(k==='return_code')return pick(r,['01','04','09','22','26']);
 if(k==='reply_text')return pick(r,['Will pay by month end','Already paid on 12th, sharing receipt','Need 30 more days','Please call me']);
 if(k==='reply_doc')return r()<.5?'receipt_'+n+'.pdf':'—';
 if(k==='property_address')return(Math.floor(r()*200)+1)+', '+pick(r,['Shanti Nagar','MG Road','Sector 21','Laxmi Colony'])+', '+pick(r,P.city);
 if(k==='claimant_name')return'ABC Bank Ltd.';
 return k.toUpperCase().slice(0,3)+'/'+n}
function cell(w,c,i,rg,basis){const f=fld(w,c.k);if(!f)return'';
 const r=rng(hash(w+c.k)+i*977);const g=c.k===basis?rg:null;
 if(f.m){if(c.mv==='count')return String(1+Math.floor(r()*4));
  if(c.mv==='all'){const n=2+Math.floor(r()*2);const v=[];for(let j=0;j<n;j++)v.push(one(w,f,r,g));return[...new Set(v)].join('; ')}}
 return one(w,f,r,g)}
const num=s=>{const n=parseFloat(String(s).replace(/[₹,]/g,''));return isNaN(n)?null:n};

function rows(t,n,rg){
 const cols=t.columns.filter(c=>fld(t.wf,c.k));
 const off=rg?hash(isoD(rg[0]))%50:0;
 const data=[];for(let i=0;i<n;i++)data.push(cols.map(c=>cell(t.wf,c,i+off,rg,t.dateBasis)));
 const head=cols.map(c=>({l:c.label||fld(t.wf,c.k).l,n:['amount','number'].includes(fld(t.wf,c.k).t)&&!(fld(t.wf,c.k).m&&c.mv==='all')}));
 let tot=null;
 if(cols.length)tot=head.map((h,j)=>{const f=fld(t.wf,cols[j].k);
  if(j===0)return'Total ('+n+' cases)';
  if(f.t==='amount'&&h.n)return inr(data.reduce((a,r)=>a+(num(r[j])||0),0));return''});
 return{head,rows:data,tot}}
function tblHTML(d,em){if(!d.head.length)return`<p class="sm mut" style="padding:10px 0">${esc(em)}</p>`;
 return`<div class="tw"><table><thead><tr>${d.head.map(h=>`<th class="${h.n?'n':''}">${esc(h.l)}</th>`).join('')}</tr></thead><tbody>`+
 d.rows.map(r=>`<tr>${r.map((v,j)=>`<td class="${d.head[j]&&d.head[j].n?'n':''}">${esc(v)}</td>`).join('')}</tr>`).join('')+
 (d.tot?`<tr class="tot">${d.tot.map((v,j)=>`<td class="${d.head[j].n?'n':''}">${esc(v)}</td>`).join('')}</tr>`:'')+`</tbody></table></div>`}

/* ===================== SENTENCE ===================== */
function fText(w,x){const f=fld(w,x.k);if(!f)return null;
 const op=(OPS[f.t].find(o=>o[0]===x.op)||OPS[f.t][0]);
 if(NOVAL.includes(op[0]))return f.l.toLowerCase()+' '+op[1];
 let v=x.v;if(Array.isArray(v)){if(!v.length)return null;v=v.join(' or ')}
 if(v===''||v==null)return null;
 if(op[0]==='lastn'||op[0]==='nextn')return f.l.toLowerCase()+' is in the '+(op[0]==='lastn'?'last':'next')+' '+v+' days';
 if(f.t==='date')v=fmtD(new Date(v));if(f.t==='amount')v=inr(v);
 return f.l.toLowerCase()+' '+op[1]+' '+v}
function sentence(t,rt){const V=(s,m)=>`<span class="v${m?' miss':''}">${esc(s)}</span>`;
 const b=fld(t.wf,t.dateBasis);
 let h=`One row per case from ${V(WF[t.wf])} for ${V(t.ent)}, where ${b?V(b.l):V('a date field',1)} falls ${rt?'between '+V(rt):'in the range the user picks'}`;
 const fl=t.filters.map(x=>fText(t.wf,x)).filter(Boolean);
 if(fl.length)h+=`, and ${fl.map(x=>V(x)).join(' and ')}`;
 h+='. ';
 const n=t.columns.length;
 h+=n?`It shows ${V(n+(n===1?' column':' columns'))}, newest first. `:`It has ${V('no columns yet',1)}. `;
 return h}

const PRE=[['last7','Last 7 days'],['this_month','This month'],['last_month','Last month'],['this_q','This quarter'],['fy','This financial year'],['custom','Custom']];
function preRange(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();const d=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
 if(p==='last7')return[d(new Date(n-6*864e5)),d(n)];
 if(p==='this_month')return[new Date(y,m,1),d(n)];
 if(p==='last_month')return[new Date(y,m-1,1),new Date(y,m,0)];
 if(p==='this_q')return[new Date(y,Math.floor(m/3)*3,1),d(n)];
 if(p==='fy')return[new Date(m>=3?y:y-1,3,1),d(n)];
 return null}

 <div class="fbar"><label class="fg"><span>Enterprise</span><select data-b="ent">${ENTS.map(e=>`<option${e===S.ent?' selected':''}>${esc(e)}</option>`).join('')}</select></label>
 <div class="fg" style="flex:1"><span>&nbsp;</span><p class="xs">${avail.length} active report${avail.length===1?'':'s'} available</p></div></div>
 <div class="run"><div class="panel pad">
  <h3>Report</h3>${opts||'<p class="xs" style="margin-top:8px">No active reports for this enterprise yet.</p>'}
  <h3 style="margin-top:18px">Date range</h3>
  <div class="presets" role="group">${PRE.map(([k,l])=>`<button data-a="pre" data-p="${k}" aria-pressed="${R.preset===k}">${l}</button>`).join('')}</div>
  <div class="row"><label class="fld"><span>From</span><input type="date" value="${R.from}" data-b="rFrom"></label>
  <label class="fld"><span>To</span><input type="date" value="${R.to}" data-b="rTo"></label></div>
  <button class="btn primary" style="width:100%;justify-content:center" data-a="gen"${R.id?'':' disabled'}>Generate report</button>
 </div><div>${res}</div></div>`}

/* ===================== HISTORY ===================== */
function histFor(){return S.hist.filter(h=>h.ent===S.ent
 &&(!S.hq||(h.name+' '+h.by+' '+h.file).toLowerCase().includes(S.hq.toLowerCase())))
 .sort((a,b)=>b.at-a.at)}
function logRun(t,res,fmt,n,via){
 S.hist.unshift({id:uid(),name:t.name,ent:t.ent,wf:t.wf,from:res.from,to:res.to,fmt,rows:n,via:via||'Download',
  at:Date.now(),by:ME(),
  file:t.name.replace(/[^a-z0-9]+/gi,'_')+'_'+t.ent.replace(/\s/g,'')+'_'+res.to.replace(/-/g,'')+'.'+fmt});
 if(S.hist.length>60)S.hist.length=60;saveH()}
function histView(){
 const list=histFor();
 const body=list.map(h=>`<tr>
  <td><strong style="font-weight:500">${esc(h.name)}</strong><div class="xs" style="margin-top:2px">${esc(h.file)}</div></td>
  <td><span class="pill p-n">${esc(WF[h.wf]||h.wf)}</span></td>
  <td class="sm">${fmtD(new Date(h.from))}<div class="xs">to ${fmtD(new Date(h.to))}</div></td>
  <td class="n sm">${h.rows}</td>
  <td><span class="pill ${h.fmt==='xlsx'?'p-i':'p-n'}">${h.fmt==='xlsx'?'Excel':'CSV'}</span>${h.via==='Email'?'<div class="xs" style="margin-top:3px">✉ Emailed</div>':''}</td>
  <td class="sm">${rel(h.at)}<div class="xs">${new Date(h.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}${' · '+esc(h.by)}</div></td>
  <td style="white-space:nowrap"><button class="btn sm" data-a="hdl" data-id="${h.id}">Download again</button>
  <button class="btn gh sm" data-a="hrun" data-id="${h.id}">Run with latest data</button></td></tr>`).join('');
 return`<div class="ph"><div><h1>Download history</h1><p class="mut sm">Every report pulled or emailed for this enterprise, by anyone. Files stay available for 90 days.</p></div>
  ${list.length?`<button class="btn gh sm" data-a="hclear">Clear history</button>`:''}</div>
 <div class="fbar">
  <label class="fg"><span>Enterprise</span><select data-b="ent">${ENTS.map(e=>`<option${e===S.ent?' selected':''}>${esc(e)}</option>`).join('')}</select></label>
  <label class="fg" style="flex:1;min-width:190px"><span>Search</span><input type="search" id="hq" placeholder="Search by report, file or person" value="${esc(S.hq)}"></label>
 </div>
 ${list.length?`<div class="note"><div><b>Download again</b> gives the exact file that was generated then, unchanged. <b>Run with latest data</b> rebuilds the report from today's data, using the same dates.</div></div>
 <div class="tw"><table><thead><tr><th>Report</th><th>Workflow</th><th>Date range</th><th class="n">Rows</th><th>Format</th><th>Generated</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`
 :`<div class="panel empty"><h3>Nothing downloaded yet</h3><p>Reports you generate and download appear here, so you can pull the same file again without setting it up twice.</p><button class="btn primary" data-a="goRun">Run a report</button></div>`}`}

/* ===================== RENDER ===================== */
function render(keep=true){
 const y=window.scrollY;
 const n=histFor().length;
 const tabs=[['templates','Report templates'],['run','Report download'],['history','History'+(n?' · '+n:'')]];
 $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" aria-current="${S.tab===k?'page':'false'}">${l}</button>`).join('');
 $('#main').innerHTML=S.tab==='templates'?(S.draft?builderView():listView()):S.tab==='history'?histView():runView();
 keep?window.scrollTo(0,y):window.scrollTo(0,0)}
function blank(){return{id:uid(),name:'',desc:'',ent:S.ent,wf:S.wf,dateBasis:'',status:'Draft',columns:[],filters:[],updated:Date.now(),by:'aleem.rayeen@presolv360.com'}}
function validate(t){const e=[];
 if(!t.name.trim())e.push('Give the report a name.');
 else if(S.tpl.some(x=>x.id!==t.id&&x.ent===t.ent&&x.name.trim().toLowerCase()===t.name.trim().toLowerCase()))e.push('This enterprise already has a report with that name.');
 if(!fld(t.wf,t.dateBasis))e.push('Choose the date field the date range applies to.');
 if(!t.columns.length)e.push('Add at least one column.');
 t.filters.forEach((f,i)=>{if(!fld(t.wf,f.k))e.push('Filter '+(i+1)+' needs a field.');
  else if(!NOVAL.includes(f.op)&&(f.v===''||f.v==null||(Array.isArray(f.v)&&!f.v.length)))e.push('Filter '+(i+1)+' ('+fld(t.wf,f.k).l+') needs a value.')});
 return e}
/* ===================== CONFIRM DIALOG ===================== */
function ask(title,body,label,fn,danger){
 S.ask=fn;
 $('#modal').innerHTML=`<h2>${esc(title)}</h2><p class="mut sm" style="margin:6px 0 20px">${esc(body)}</p>
 <div class="macts"><button class="btn" data-a="ckx">Cancel</button><button class="btn ${danger?'red':'primary'}" data-a="ckok">${esc(label)}</button></div>`;
 $('#ov').classList.add('open');
 setTimeout(()=>{const b=$('#modal [data-a="ckok"]');if(b)b.focus()},30)}
function closeAsk(){$('#ov').classList.remove('open');S.ask=null}

/* ===================== EMAIL SCHEDULE ===================== */
const VALID=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function openEmail(){
 const t=S.tpl.find(x=>x.id===S.run.res.id);if(!t)return;
 const ex=S.sched.find(x=>x.tplId===t.id);
 const d=new Date();d.setMonth(d.getMonth()+3);
 S.em=ex?{...ex,to:[...ex.to]}:{id:uid(),tplId:t.id,freq:'weekly',time:'09:00',until:isoD(d),to:[],fmt:'xlsx',err:''};
 drawEmail()}
function drawEmail(){
 const e=S.em,t=S.tpl.find(x=>x.id===e.tplId);
 $('#modal').innerHTML=`<h2>Email this report</h2>
 <p class="mut sm" style="margin-bottom:16px">${esc(t.name)} · ${esc(t.ent)} · ${esc(WF[t.wf])}</p>
 <label class="fld"><span>Send to</span>
  <div class="emchips" id="chipbox">${e.to.map((a,i)=>`<span class="emchip">${esc(a)}<button data-a="emdel" data-i="${i}" aria-label="Remove ${esc(a)}">✕</button></span>`).join('')}
   <input type="text" id="emin" placeholder="${e.to.length?'Add another':'name@company.com'}" aria-label="Email address"></div>
  <p class="hint">Press Enter or comma after each address.</p></label>
 <div class="row">
  <label class="fld"><span>How often</span><select data-b="emFreq">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}"${e.freq===k?' selected':''}>${l[0].toUpperCase()+l.slice(1)}</option>`).join('')}</select></label>
  <label class="fld"><span>Time (IST)</span><input type="time" step="1800" value="${e.time}" data-b="emTime"></label></div>
 <div class="row">
  <label class="fld"><span>Keep sending until</span><input type="date" value="${e.until}" data-b="emUntil"></label>
  <label class="fld"><span>File format</span><select data-b="emFmt"><option value="xlsx"${e.fmt==='xlsx'?' selected':''}>Excel (.xlsx)</option><option value="csv"${e.fmt==='csv'?' selected':''}>CSV</option></select></label></div>
 <div class="note" style="margin-bottom:14px"><div>Each email covers the <b>same date range relative to the send date</b> as the one you just ran, so a weekly email always carries the latest week.</div></div>
 ${e.err?`<div class="errs" style="margin-bottom:14px">${esc(e.err)}</div>`:''}
 <div class="macts"><button class="btn" data-a="emx">Cancel</button><button class="btn primary" data-a="emsend">Send</button></div>`;
 $('#ov').classList.add('open');
 const i=$('#emin');if(i){i.focus();i.addEventListener('keydown',emKey);i.addEventListener('blur',()=>emAdd(i.value))}}
function emKey(ev){const i=ev.target;
 if(ev.key==='Enter'||ev.key===','||ev.key===' '){ev.preventDefault();emAdd(i.value)}
 else if(ev.key==='Backspace'&&!i.value&&S.em.to.length){S.em.to.pop();drawEmail()}}
function emAdd(v){v=(v||'').trim().replace(/[,;]$/,'');if(!v)return;
 if(!VALID(v)){S.em.err=`"${v}" is not a valid email address.`;drawEmail();return}
 if(!S.em.to.includes(v))S.em.to.push(v);S.em.err='';drawEmail()}
function closeEm(){$('#ov').classList.remove('open');S.em=null}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'){closeEm();closeAsk()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEm();closeAsk()}});
$('#modal').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='ckx'){closeAsk();return}
 if(a==='ckok'){const f=S.ask;closeAsk();if(f)f();return}
 if(a==='emdel'){S.em.to.splice(+b.dataset.i,1);drawEmail()}
 else if(a==='emx')closeEm();
 else if(a==='emsend'){
  const i=$('#emin');if(i&&i.value.trim())emAdd(i.value);
  const e2=S.em;if(!e2)return;
  if(!e2.to.length){e2.err='Add at least one email address.';drawEmail();return}
  if(new Date(e2.until)<new Date()){e2.err='The end date is in the past.';drawEmail();return}
  const ix=S.sched.findIndex(x=>x.id===e2.id);
  const rec={id:e2.id,tplId:e2.tplId,freq:e2.freq,time:e2.time,until:e2.until,to:[...e2.to],fmt:e2.fmt};
  ix>=0?S.sched[ix]=rec:S.sched.push(rec);
  const t=S.tpl.find(x=>x.id===rec.tplId);
  logRun(t,S.run.res,rec.fmt,11+(hash(S.run.res.from+t.id)%13),'Email');
  closeEm();render();toast('First email sent. Repeats '+FREQ[rec.freq]+' at '+rec.time+' until '+fmtD(new Date(rec.until)));}});
$('#modal').addEventListener('change',e=>{
 const b=e.target.dataset.b;if(!b||!S.em)return;
 if(b==='emFreq')S.em.freq=e.target.value;
 if(b==='emTime')S.em.time=e.target.value;
 if(b==='emUntil')S.em.until=e.target.value;
 if(b==='emFmt')S.em.fmt=e.target.value;
 S.em.err='';drawEmail()});

/* ===================== EVENTS ===================== */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.draft=null;render(false)});
$('#theme').onclick=()=>{const d=document.documentElement;
 const c=d.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
 d.setAttribute('data-theme',c==='dark'?'light':'dark')};

$('#main').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,t=S.draft,i=+b.dataset.i;
 switch(a){
  case'wf':S.wf=b.dataset.wf;render();break;
  case'new':S.draft=blank();S.errs=[];S.pickQ='';S.pickGrp='';render(false);break;
  case'edit':{S.draft=JSON.parse(JSON.stringify(S.tpl.find(x=>x.id===b.dataset.id)));S.errs=[];S.pickQ='';S.pickGrp='';render(false);break}
  case'dup':{const s=S.tpl.find(x=>x.id===b.dataset.id);const c=JSON.parse(JSON.stringify(s));c.id=uid();c.name=s.name+' (copy)';c.status='Draft';c.updated=Date.now();S.tpl.push(c);save();render();toast('Duplicated as a draft');break}
  case'del':{const s=S.tpl.find(x=>x.id===b.dataset.id);
   const hasSched=S.sched.some(x=>x.tplId===s.id);
   ask('Delete this report?','"'+s.name+'" will be removed from the list.'+(hasSched?' Its scheduled email will also stop.':'')+' Past downloads stay in History.','Delete',()=>{
     S.tpl=S.tpl.filter(x=>x.id!==s.id);S.sched=S.sched.filter(x=>x.tplId!==s.id);
     if(S.run.res&&S.run.res.id===s.id)S.run.res=null;
     save();render();toast('Deleted "'+s.name+'"')},true);break}
  case'reset':ask('Reset to samples?','Every report you have built will be replaced by the four sample reports.','Reset',()=>{
     S.tpl=seed();S.sched=[];S.run.res=null;save();render();toast('Samples restored')},true);break;
  case'cancel':S.draft=null;S.errs=[];render(false);break;
  case'save':{S.errs=validate(t);if(S.errs.length){render();break}
   t.updated=Date.now();const ix=S.tpl.findIndex(x=>x.id===t.id);
   ix>=0?S.tpl[ix]=t:S.tpl.push(t);save();S.ent=t.ent;S.wf=t.wf;S.draft=null;render(false);toast('Saved '+t.name);break}
  case'dwf':{const w=b.dataset.wf;if(w===t.wf)break;
   const go=()=>{Object.assign(t,{wf:w,dateBasis:'',columns:[],filters:[]});S.pickGrp='';render()};
   if(t.columns.length||t.filters.length)ask('Switch workflow?','Moving to '+WF[w]+' clears the columns and filters you have picked, because each workflow has its own fields.','Switch',go,true);
   else go();
   break}
  case'pick':{const k=b.dataset.k;const ix=t.columns.findIndex(c=>c.k===k);
   ix>=0?t.columns.splice(ix,1):t.columns.push(mkcol(t.wf,k));render();break}
  case'cu':[t.columns[i-1],t.columns[i]]=[t.columns[i],t.columns[i-1]];render();break;
  case'cd':[t.columns[i+1],t.columns[i]]=[t.columns[i],t.columns[i+1]];render();break;
  case'cx':t.columns.splice(i,1);render();break;
  case'cclear':t.columns=[];render();break;
  case'fadd':t.filters.push({k:'',op:'',v:''});render();break;
  case'fx':t.filters.splice(i,1);render();break;
  case'pre':S.run.preset=b.dataset.p;render();break;
  case'gen':{const R=S.run;if(!R.from||!R.to){toast('Choose both a start and an end date.');break}
   if(R.from>R.to){toast('The start date is after the end date.');break}
   R.res={id:R.id,from:R.from,to:R.to,at:Date.now()};render();break}
  case'dl':{const t2=S.tpl.find(x=>x.id===S.run.res.id);const f=b.dataset.f;
   const n=11+(hash(S.run.res.from+t2.id)%13);
   logRun(t2,S.run.res,f,n);render();
   toast('Downloaded as '+(f==='xlsx'?'Excel':'CSV')+'. Saved to History.');break}
  case'email':openEmail();break;
  case'unsched':S.sched=S.sched.filter(x=>x.id!==b.dataset.id);render();toast('Scheduled email cancelled');break;
  case'goRun':S.tab='run';render(false);break;
  case'hdl':{const h=S.hist.find(x=>x.id===b.dataset.id);
   toast('Re-downloading '+h.file+'. Prototype only.');break}
  case'hrun':{const h=S.hist.find(x=>x.id===b.dataset.id);
   const t3=S.tpl.find(x=>x.ent===h.ent&&x.name===h.name&&x.status==='Active');
   if(!t3){toast('That report is no longer active, so it cannot be re-run.');break}
   S.ent=h.ent;S.run.id=t3.id;S.run.preset='custom';S.run.from=h.from;S.run.to=h.to;
   S.run.res={id:t3.id,from:h.from,to:h.to,at:Date.now()};
   S.tab='run';render(false);toast('Rebuilt with the latest data');break}
  case'hclear':{const n=histFor().length;
   ask('Clear history?','This removes the '+n+' record'+(n===1?'':'s')+' shown for this client. In the real product an audit trail cannot be cleared.','Clear',()=>{
     const keep=new Set(histFor().map(h=>h.id));
     S.hist=S.hist.filter(h=>!keep.has(h.id));saveH();render();toast('History cleared')},true);break}
 }});

$('#main').addEventListener('input',e=>{
 const el=e.target,t=S.draft,b=el.dataset.b;
 if(el.id==='q'){S.q=el.value;const p=el.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}return}
 if(el.id==='hq'){S.hq=el.value;const p=el.selectionStart;render();const n=$('#hq');if(n){n.focus();n.setSelectionRange(p,p)}return}
 if(el.id==='pickQ'){S.pickQ=el.value;const p=el.selectionStart;render();const n=$('#pickQ');if(n){n.focus();n.setSelectionRange(p,p)}return}
 if(!t)return;
 if(b==='name'||b==='desc'){t[b]=el.value;const s=document.querySelector('.sent');if(s&&b==='name')s.innerHTML=sentence(t);return}
 if(b==='colLabel'){t.columns[+el.dataset.col].label=el.value;return}
 if(b==='fVal'&&el.tagName==='INPUT'){t.filters[+el.dataset.fi].v=el.value;return}});

$('#main').addEventListener('change',e=>{
 const el=e.target,t=S.draft,b=el.dataset.b;
 if(b==='ent'){S.ent=el.value;S.run.res=null;render();return}
 if(b==='runId'){S.run.id=el.value;render();return}
 if(b==='rFrom'||b==='rTo'){S.run[b==='rFrom'?'from':'to']=el.value;S.run.preset='custom';render();return}
 if(b==='pickGrp'){S.pickGrp=el.value;render();return}
 if(!t)return;
 switch(b){
  case'dEnt':t.ent=el.value;render();break;
  case'status':t.status=el.value;render();break;
  case'dateBasis':t.dateBasis=el.value;render();break;
  case'colMv':t.columns[+el.dataset.col].mv=el.value;render();break;
  case'fKey':{const f=t.filters[+el.dataset.fi];f.k=el.value;const fd=fld(t.wf,f.k);
   f.op=fd?OPS[fd.t][0][0]:'';f.v=fd&&fd.t==='enum'?[]:'';render();break}
  case'fOp':{const f=t.filters[+el.dataset.fi];f.op=el.value;if(NOVAL.includes(f.op))f.v='';render();break}
  case'fVal':{const f=t.filters[+el.dataset.fi];
   f.v=el.multiple?[...el.selectedOptions].map(o=>o.value):el.value;render();break}
 }});

render(false);
</script>
</body>
</html>
